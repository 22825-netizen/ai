<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องสมมติ · คุยกับเอไอ</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff5fa;--card:#fff;--ink:#3b2f3f;--mut:#8b7a91;--pri:#e8739c;--pri2:#9b6fe0;--line:#f1dce8;--me:#ffe3ef;--th:#8f7f9b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1622;--card:#271f30;--ink:#f3e9f6;--mut:#a698ae;--pri:#f38ab0;--pri2:#b99cf2;--line:#3a2f45;--me:#4a2b3e;--th:#b5a6c0}}
:root[data-theme="dark"]{--bg:#1c1622;--card:#271f30;--ink:#f3e9f6;--mut:#a698ae;--pri:#f38ab0;--pri2:#b99cf2;--line:#3a2f45;--me:#4a2b3e;--th:#b5a6c0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:'Kanit',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;overscroll-behavior:none}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:8px 12px;background:var(--line);color:var(--ink)}
button:disabled{opacity:.5;cursor:not-allowed}
button.p{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
button.d{background:#f4c6c6;color:#7a1f1f}
textarea,input,select{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical}
#app{display:flex;height:100%}
aside{width:270px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:10px;z-index:5}
.logo{font-size:21px;font-weight:500;color:var(--pri)}
#rooms{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.room{padding:10px 12px;border-radius:14px;cursor:pointer;border:1px solid transparent}
.room.on{background:var(--me);border-color:var(--pri)}
.mut{color:var(--mut);font-size:12px}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{flex:1;font-size:17px;font-weight:500;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{display:none}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,var(--bg),var(--bg))}
.note{background:var(--card);border:1px dashed var(--pri);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--mut);white-space:pre-wrap}
.msg{display:flex;flex-direction:column;gap:4px;max-width:90%}
.msg.me{align-self:flex-end;align-items:flex-end}
.hd{display:flex;align-items:center;gap:8px}
.msg.me .hd{flex-direction:row-reverse}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;box-shadow:0 2px 6px #0002}
.bub{background:var(--card);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:9px 13px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.me .bub{background:var(--me);border-radius:18px 4px 18px 18px}
.nm{font-size:12px;color:var(--mut);margin-bottom:2px}
.me .nm{text-align:right}
.act{font-style:italic;color:var(--pri2)}
.th{color:var(--th);font-size:.93em}
#bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px 0;background:var(--card);border-top:1px solid var(--line)}
#chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0;background:var(--card)}
.chip{border:2px solid var(--line);border-radius:20px;padding:4px 10px;background:var(--bg)}
.chip.on{border-color:var(--pri);background:var(--me)}
#composer{display:flex;gap:8px;align-items:flex-end;padding:8px 12px 12px;background:var(--card)}
#inp{max-height:160px}
.chip{position:relative;display:inline-flex;align-items:center;gap:5px;padding-bottom:11px}
.mi{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none}
.hb{position:absolute;left:10px;right:10px;bottom:3px;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
.hb b{display:block;height:100%;transition:width .6s}
.chip em{font-style:normal;font-size:12px;font-weight:500}
.chip.up em{color:#2a9d5c}.chip.down em{color:#e5484d}
.chip.down{animation:sh .5s}
@keyframes sh{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
#bond{padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.bt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.bt .lk{opacity:.5}
.pb{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:5px 0 3px}
.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .6s}
.evb{align-self:center;text-align:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:16px;padding:10px 18px;white-space:pre-wrap;max-width:92%;font-size:14px}
.inner{font-size:13px;font-style:italic;color:var(--th);padding-left:6px}
#bar select{width:auto}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:20;max-width:90%}
#ed{position:fixed;inset:0;background:#0007;z-index:10;display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px;overflow-y:auto}
#ed>div{background:var(--card);border-radius:20px;padding:18px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}
#ed label{display:block;font-size:13px;color:var(--mut)}
#ed h4{margin:8px 0 0;color:var(--pri)}
details{border:1px solid var(--line);border-radius:14px;padding:8px 10px}
summary{cursor:pointer;font-weight:500}
.row{display:flex;gap:8px}.row>*{flex:1}
@media (max-width:720px){
aside{position:fixed;top:0;bottom:0;left:0;padding-top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px #0004}
aside.open{transform:none}
.menu{display:inline-block}}
</style>
</head>
<body>
<div id="app">
<aside id="side">
  <div class="logo">🎭 ห้องสมมติ</div>
  <button class="p" id="newRoom">＋ สร้างสถานการณ์ใหม่</button>
  <div id="rooms"></div>
  <div class="mut">คุยได้ไม่จำกัดข้อความ · บันทึกในเบราว์เซอร์อัตโนมัติ</div>
</aside>
<main>
  <header>
    <button class="menu" id="menu">☰</button>
    <h1 id="title"></h1>
    <button id="undo" title="ลบข้อความล่าสุด">↩</button>
    <button id="regen" title="ให้ตอบใหม่">🔁</button>
    <button id="clear" title="ล้างแชท">🧹</button>
    <button id="bsoc" title="ส่องโซเชียลของเอไอ (ปลดล็อกที่ 90)">📱</button>
    <button id="edit" title="แก้ไขสถานการณ์/ตัวละคร">⚙️</button>
    <button id="theme" title="โหมดมืด/สว่าง">🌙</button>
  </header>
  <div id="bond"></div>
  <div id="chat"></div>
  <div id="chips"></div>
  <div id="bar">
    <button id="talk">🎭 ให้เอไอคุยกันเอง</button>
    <select id="turns" title="จำนวนประโยค"><option value="2">2 ประโยค</option><option value="4" selected>4 ประโยค</option><option value="8">8 ประโยค</option><option value="12">12 ประโยค</option></select>
    <button id="stop" class="d" hidden>⏹ หยุด</button>
    <select id="tier" title="ความเร็ว"><option value="quick">⚡ เร็ว</option><option value="default">🧠 ฉลาดขึ้น (ช้ากว่า)</option></select>
  </div>
  <div id="bar" style="border:0;padding-top:6px">
    <button id="bThink">💭 คิดในใจ</button><button id="bAct">✋ การกระทำ</button>
    <span class="mut">(คิดในใจ) &nbsp; **การกระทำ** &nbsp; ส่ง: Ctrl+Enter</span>
  </div>
  <div id="composer">
    <textarea id="inp" rows="2" placeholder="พิมพ์ได้เลย ไม่จำกัดความยาว… เช่น สวัสดีมิ้นท์ (ทำไมวันนี้เงียบจัง) **นั่งลงข้างๆ**"></textarea>
    <button class="p" id="send">ส่ง ✨</button>
  </div>
</main>
</div>
<div id="ed" hidden><div>
  <div id="edbody"></div>
  <button class="p" id="edclose">เสร็จแล้ว ✔</button>
</div></div>
<div id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s), uid=()=>Math.random().toString(36).slice(2,9);
const esc=t=>String(t??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ea=t=>esc(t).replace(/"/g,'&quot;');
const fmt=t=>esc(t).replace(/\*\*([\s\S]+?)\*\*/g,'<span class="act">$1</span>').replace(/\(([\s\S]+?)\)/g,'<span class="th">($1)</span>');
const KEY='roleplay-rooms-v1';
let S,sample=null,busy=false,ctl=null,stopFlag=false,pendEv=false;const flash={};

const mkChar=o=>({id:uid(),name:'ตัวละครใหม่',emoji:'🙂',color:'#ffc2da',persona:'',style:'',habits:'',img:'',relation:'',feel:'',aff:30,posts:[],...o});
const mkRoom=o=>{const r={id:uid(),name:'สถานการณ์ใหม่',setting:'',me:{name:'ฉัน',emoji:'😊',profile:'',img:''},chars:[mkChar()],msgs:[],bond:0,...o};r.sel=[r.chars[0].id];r.main=r.chars[0].id;return r};
function seed(){
  const a=mkRoom({name:'🏠 อยู่บ้านกับน้องสาว',setting:'เย็นวันเสาร์ที่บ้าน พ่อแม่ไปทำงานต่างจังหวัด เหลือแค่พี่กับน้องสองคน ฝนกำลังตก',
    me:{name:'พี่',emoji:'😎',profile:'พี่ชาย/พี่สาว ม.3 ใจดีแต่ชอบแกล้งน้อง'},
    chars:[mkChar({name:'น้องมิ้นท์',emoji:'🐰',color:'#ffb3d1',persona:'น้องสาววัย 11 ปี ร่าเริง ขี้อ้อน ชอบดูการ์ตูน ปากไวนิดหน่อย',style:'พูดน่ารัก เรียกพี่ว่า "พี่~" ลงท้ายด้วย นะ/ค่ะ',habits:'ชอบกอดหมอนข้าง ขอขนมบ่อยๆ'})]});
  const b=mkRoom({name:'💼 ทำงานกับเพื่อนสนิท',setting:'ห้องทำโปรเจกต์ของโรงเรียน ส่งงานพรุ่งนี้เช้า แต่ยังเสร็จไม่ถึงครึ่ง',
    me:{name:'ฉัน',emoji:'🎧',profile:'คนที่รับผิดชอบส่วนโค้ดของโปรเจกต์'},
    chars:[mkChar({name:'ตอง',emoji:'🦊',color:'#ffd9a0',persona:'เพื่อนสนิท ตลก ขี้เล่น ชอบเลื่อนงาน แต่พึ่งพาได้ตอนคับขัน',style:'พูดกันเอง เรียกฉันว่า "แก" หรือ "เพื่อน"',habits:'ชอบกินขนมระหว่างทำงาน'}),
           mkChar({name:'ฟ้า',emoji:'🌸',color:'#c9c2ff',persona:'เพื่อนในกลุ่ม เรียบร้อย จัดระเบียบเก่ง กังวลเรื่องเวลา',style:'สุภาพ พูดช้าๆ',habits:'จดตารางงานตลอด'})]});
  return {rooms:[a,b],cur:a.id,tier:'quick'};
}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S||!S.rooms||!S.rooms.length)S=seed();S.rooms.forEach(fix)}
function fix(r){r.bond=r.bond||0;r.me.img=r.me.img||'';r.chars.forEach(c=>{c.img=c.img||'';c.relation=c.relation||'';c.feel=c.feel||'';if(typeof c.aff!=='number')c.aff=30;c.posts=c.posts||[]});if(!cOf(r,r.main))r.main=r.chars[0].id}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const cur=()=>S.rooms.find(r=>r.id===S.cur)||S.rooms[0];
const cOf=(r,id)=>r.chars.find(c=>c.id===id);

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3200)}
function ui(){$('#send').disabled=$('#talk').disabled=busy;$('#stop').hidden=!busy}
function render(){
  const r=cur();S.cur=r.id;
  $('#rooms').innerHTML=S.rooms.map(x=>`<div class="room ${x.id===r.id?'on':''}" data-id="${x.id}"><b>${esc(x.name)}</b><div class="mut">${x.chars.length} ตัวละคร · ${x.msgs.length} ข้อความ</div></div>`).join('');
  $('#title').textContent=r.name;$('#tier').value=S.tier||'quick';
  renderBond();renderChat();renderChips();ui();
}
const av=(c,k='av')=>`<div class="${k}" style="background:${c.img?`url(${ea(c.img)}) center/cover`:ea(c.color)}">${c.img?'':esc(c.emoji)}</div>`;
function bubble(m,r){
  if(m.role==='ev')return `<div class="evb">${esc(m.text)}</div>`;
  if(m.role==='me')return `<div class="msg me"><div class="hd">${av({...r.me,color:'var(--me)'})}<span class="nm">${esc(r.me.name)}</span></div><div class="bub">${fmt(m.text)}</div></div>`;
  const c=cOf(r,m.cid)||{name:'?',emoji:'❔',color:'#ddd'};
  return `<div class="msg"><div class="hd">${av(c)}<span class="nm">${esc(c.name)}${c.id===r.main?' ⭐':''}</span></div><div class="bub">${fmt(m.text)}</div>${m.inner&&r.bond>=60?`<div class="inner">💭 ${esc(m.inner)}</div>`:''}</div>`;
}
function renderChat(){
  const r=cur();
  $('#chat').innerHTML=(r.setting?`<div class="note">🎬 ฉาก: ${esc(r.setting)}</div>`:'')+
    (r.msgs.length?'':`<div class="note">เริ่มพิมพ์ได้เลย! เลือกตัวละครด้านล่างว่าจะให้ใครตอบ 💬<br>(วงเล็บ) = คิดในใจ · **ดอกจันสองตัว** = การกระทำ</div>`)+
    r.msgs.map(m=>bubble(m,r)).join('');
  scroll();
}
const scroll=()=>{const c=$('#chat');c.scrollTop=c.scrollHeight};
function renderChips(){
  const r=cur();r.sel=r.sel.filter(id=>cOf(r,id));
  const all=r.sel.length===r.chars.length;
  $('#chips').innerHTML=`<button class="chip ${all?'on':''}" data-id="*">👥 ทุกตัว</button>`+
    r.chars.map(c=>{const f=flash[c.id];return `<button class="chip ${r.sel.includes(c.id)?'on':''} ${f>0?'up':f<0?'down':''}" data-id="${c.id}" title="ความชอบ ${c.aff}/100">${av(c,'mi')}${c.id===r.main?'⭐':''}${esc(c.name)}${f?`<em>${f>0?'+'+f:f}</em>`:''}<i class="hb"><b style="width:${c.aff}%;background:${c.aff<25?'#e5484d':'var(--pri)'}"></b></i></button>`}).join('');
}

/* ---------- AI ---------- */
function hist(r){
  const out=[];let n=0;
  for(let i=r.msgs.length-1;i>=0;i--){
    const m=r.msgs[i];if(!m.text)continue;
    const nm=m.role==='ev'?'เหตุการณ์พิเศษ':m.role==='me'?r.me.name:(cOf(r,m.cid)||{name:'?'}).name;
    const l=`[${nm}] ${m.text}`;n+=l.length*3;if(n>42000)break;out.unshift(l);
  }
  return out.join('\n');
}
function prompt(r,c,auto){
  const others=r.chars.filter(x=>x.id!==c.id).map(x=>`- ${x.name}: ${x.persona||'-'} | สไตล์พูด: ${x.style||'-'} | นิสัย/การกระทำ: ${x.habits||'-'}`).join('\n')||'(ไม่มี)';
  return `คุณกำลังเล่นบทบาทสมมติ (roleplay) ในฉากที่ผู้ใช้สร้างขึ้น ตอนนี้คุณรับบทเป็น "${c.name}"

[ฉาก/เหตุการณ์]
${r.setting||'(ไม่ได้ระบุ)'}

[ตัวละครของคุณ: ${c.name}]
บุคลิก: ${c.persona||'-'}
สไตล์การพูด: ${c.style||'-'}
นิสัย/การกระทำที่มักทำ: ${c.habits||'-'}

[ผู้ใช้เล่นเป็น: ${r.me.name}]
${r.me.profile||'-'}

[ความสัมพันธ์ของ ${c.name}]
${rel(r,c)}

[ตัวละครอื่นในฉาก]
${others}

[กติกา]
- ข้อความของ ${r.me.name}: ข้อความใน (วงเล็บ) คือความคิดในใจที่ตัวละครอื่นไม่ได้ยินและไม่รู้ ห้ามแสดงว่ารู้ / ข้อความใน **ดอกจันสองตัว** คือการกระทำ / ข้อความอื่นคือคำพูด
- ตอบเป็น ${c.name} คนเดียวเท่านั้น ห้ามพูดหรือทำแทน ${r.me.name} หรือตัวละครอื่น
- การกระทำเขียนใน **ดอกจันสองตัว** คำพูดเขียนตรงๆ ไม่ต้องใส่ชื่อนำหน้า และห้ามใส่ความคิดในวงเล็บในส่วนคำตอบ
- อยู่ในคาแรกเตอร์ตลอด ตอบเป็นภาษาไทย กระชับ 1-4 ประโยค (ยาวกว่านี้ได้ถ้าสถานการณ์ต้องการ)
- เนื้อหาต้องเหมาะสมกับวัยรุ่น อบอุ่น ไม่รุนแรง ไม่มีเนื้อหาทางเพศ

[บทสนทนาที่ผ่านมา]
${hist(r)||'(ยังไม่มี)'}

${tail(r,c,auto)}`;
}
const AFF=a=>a<20?'เย็นชา ระแวง พูดห้วน':a<45?'ยังไม่ไว้ใจ สุภาพแต่เว้นระยะ':a<70?'เป็นมิตร':a<90?'สนิทและไว้ใจ':'รักและผูกพันมาก';
function rel(r,c){
  const main=c.id===r.main,b=r.bond,me=r.me.name;
  let s=`${c.name} เป็น: ${c.relation||'-'} ของ ${me} | ความรู้สึกที่มีต่อ ${me}: ${c.feel||'-'}\nระดับความชอบตอนนี้ ${c.aff}/100 → ${AFF(c.aff)} (แสดงท่าทีให้สอดคล้อง)\n`;
  s+=main?`${c.name} เป็นตัวหลักของเรื่อง`:`${c.name} เป็นตัวรอง มาเสริมให้เรื่องสนุกขึ้น`;
  if(main&&b>=30)s+=` — อยากคุยกับ ${me} มากขึ้น ชวนคุย ถามต่อ เล่าเรื่องตัวเองบ่อยๆ`;

เขียนเฉพาะสิ่งที่ ${c.name} พูดหรือทำ แล้วปิดท้ายด้วยบรรทัดเหล่านี้เสมอ:

function parse(t,c){
  const i=t.indexOf('##'),rest=i<0?'':t.slice(i).replace(/−/g,'-'),a=rest.match(/##\s*ใจ\s*[:：]\s*([^\n#]*)/),b=rest.match(/##\s*ชอบ\s*[:：]\s*([+-]?\d+)/);
  return {text:clean((i<0?t:t.slice(0,i)).trim(),c),inner:a?a[1].trim():'',d:b?parseInt(b[1]):0}}
const clean=(t,c)=>t.replace(/^\s*\[[^\]\n]{1,30}\]\s*/,'').replace(new RegExp('^\\s*'+c.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*[:：]\\s*'),'');

async function gen(cid,auto,re){
  const r=cur(),c=cOf(r,cid);if(!c)return false;
  const m={id:uid(),role:'ai',cid,text:''};
  const p=prompt(r,c,auto);
  r.msgs.push(m);renderChat();
  const el=$('#chat').lastElementChild.querySelector('.bub');el.textContent='กำลังคิด… 💭';
  ctl=new AbortController();let ok=true,pr=null;
  try{
    const res=await sample(p,{cache:false,signal:ctl.signal,modelTier:S.tier||'quick',onText:({text})=>{m.text=parse(text,c).text;el.innerHTML=fmt(m.text);scroll()}});
    pr=parse(res.text,c);m.text=pr.text;
  }catch(e){
    ok=false;if(e&&e.text)m.text=parse(e.text,c).text;
    if(!e||e.code!=='cancelled')toast(EM[e&&e.code]||'เชื่อมต่อไม่ได้ ลองอีกครั้งนะ');
  }
  if(!m.text.trim())r.msgs=r.msgs.filter(x=>x!==m);
  else if(pr){m.inner=pr.inner;if(!auto&&!re){applyAff(c,pr.d);if(c.id===r.main)addBond(2)}}
  save();render();return ok;
}
async function run(ids,auto,re){
  if(!sample){toast('ต้องเปิดหน้านี้ผ่าน Claude ถึงจะคุยกับเอไอได้');return}
  busy=true;stopFlag=false;ui();
  for(const id of ids){if(stopFlag||!(await gen(id,auto,re)))break}
  if(pendEv&&!stopFlag){pendEv=false;await gen(cur().main,'ev')}
  pendEv=false;busy=false;ui();
}
function targets(){const r=cur();return r.chars.filter(c=>r.sel.includes(c.id)).map(c=>c.id)}
async function send(){
  if(busy)return;const r=cur(),t=$('#inp').value.trim(),ids=targets();
  if(!ids.length){toast('เลือกตัวละครที่จะให้ตอบก่อนนะ');return}
  if(t){r.msgs.push({id:uid(),role:'me',text:t});$('#inp').value='';$('#inp').style.height='';save();render()}
  await run(ids,!t);
}
async function talk(){
  if(busy)return;const r=cur(),n=+$('#turns').value;
  let pool=targets();if(!pool.length)pool=r.chars.map(c=>c.id);
  const last=[...r.msgs].reverse().find(m=>m.role==='ai');
  let i=last?pool.indexOf(last.cid):-1;const ids=[];
  for(let k=0;k<n;k++){i=(i+1)%pool.length;ids.push(pool[i])}
  await run(ids,true);
}

$('#regen').onclick=()=>{
  if(busy)return;const r=cur(),l=r.msgs[r.msgs.length-1];
  if(!l||l.role!=='ai'){toast('ยังไม่มีคำตอบของเอไอให้ตอบใหม่');return}
  r.msgs.pop();save();render();run([l.cid],false,true);
};
$('#clear').onclick=()=>{if(!busy&&confirm('ล้างแชท? (ค่าความสัมพันธ์และความชอบจะรีเซ็ตด้วย)')){const r=cur();r.msgs=[];r.bond=0;r.chars.forEach(c=>c.aff=30);save();render()}};
$('#theme').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme==='dark'||(!d.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);d.dataset.theme=dark?'light':'dark'};
$('#inp').addEventListener('input',e=>{const t=e.target;t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'});
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}});
function wrap(a,b){const t=$('#inp'),s=t.selectionStart,e=t.selectionEnd,v=t.value;t.value=v.slice(0,s)+a+v.slice(s,e)+b+v.slice(e);t.focus();t.setSelectionRange(s+a.length,e+a.length)}
$('#bThink').onclick=()=>wrap('(',')');
$('#bAct').onclick=()=>wrap('**','**');

load();render();
(async()=>{
  try{sample=window.claude?await claude.use('sample'):null}catch(e){sample=null}
  if(!sample)toast('เปิดผ่าน Claude เพื่อคุยกับเอไอได้นะ');
})();
</script>
</body>
</html>
